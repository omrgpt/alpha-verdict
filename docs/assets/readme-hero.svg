  <rect x="32" y="100" width="456" height="8" rx="4" fill="#16233f"/>
  <rect x="32" y="100" width="185" height="8" rx="4" fill="#fbbf24"/>
  <g><rect x="32" y="128" width="90" height="22" rx="11" fill="#111c33"/><text x="77" y="143" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#f87171" text-anchor="middle">COST_FRAGILE</text></g><g><rect x="132" y="128" width="117" height="22" rx="11" fill="#111c33"/><text x="190" y="143" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#f87171" text-anchor="middle">FOLD_INSTABILITY</text></g><g><rect x="259" y="128" width="136" height="22" rx="11" fill="#111c33"/><text x="327" y="143" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#fbbf24" text-anchor="middle">BOOTSTRAP_UNCERTAIN</text></g>
  <text x="32" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#475569">7 findings - deterministic reviewers - not investment advice</text>
</g>
  <g transform="translate(620,300)">  <rect x="1" y="1" width="518" height="178" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>
