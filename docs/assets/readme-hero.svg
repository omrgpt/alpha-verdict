  <text x="32" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#64748b">synthetic - 780 sessions - weekly rebalance</text>
  <rect x="392" y="22" width="96" height="30" rx="15" fill="#111c33" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="440" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#fbbf24" text-anchor="middle">WARN</text>
