<svg width="1200" height="560" viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AlphaVerdict adversarial verdicts">
  <rect width="1200" height="560" rx="20" fill="#060d1a"/>
  <rect x="1" y="1" width="1198" height="558" rx="19" fill="none" stroke="#1e293b" stroke-width="2"/>
  <circle cx="112" cy="118" r="34" fill="#0b1220" stroke="#14b8a6" stroke-width="2.5"/>
  <path d="M96 128 L112 96 L128 128 Z" fill="none" stroke="#5eead4" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="164" y="112" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#f1f5f9">AlphaVerdict</text>
  <text x="165" y="140" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#5eead4">Adversarial verdicts for stock strategies.</text>
  <text x="66" y="196" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">Five deterministic reviewers try to falsify your backtest</text>
  <text x="66" y="220" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">before the market does: causality, leakage, friction,</text>
  <text x="66" y="244" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">robustness, and multiple-testing burden.</text>
  <rect x="66" y="278" width="330" height="44" rx="10" fill="#0f1c33" stroke="#233252"/>
  <text x="86" y="305" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#67e8f9">$ uvx alphaverdict demo --real</text>
  <text x="66" y="360" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">Point-in-time data contract - provider-neutral - no broker, no orders, no AI in the loop</text>
  <g transform="translate(620,90)">  <rect x="1" y="1" width="518" height="178" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>
